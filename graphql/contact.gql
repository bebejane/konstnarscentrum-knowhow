query ContactPage {
	contactPage {
		title
		image {
			...ImageFragment
		}
		showImage
		intro
		content {
			links {
				__typename
				... on LexiconRecord {
					__typename
					id
					word
					desc {
						blocks
						links
						value
					}
				}
			}
			value
			blocks {
				__typename
				... on ButtonRecord {
					__typename
					id
					text
					url
				}
				... on ImageRecord {
					__typename
					id
					image {
						...ImageFragment
					}
					layout
				}
				... on ImagesWithTextBelowRecord {
					__typename
					id
					kolumn {
						__typename
						... on ImageTextBelowRecord {
							__typename
							id
							image {
								...ImageFragment
							}
							text {
								blocks
								inlineBlocks
								links
								value
							}
						}
					}
				}
				... on VideoRecord {
					__typename
					id
					title
					video {
						height
						width
						title
						provider
						providerUid
						thumbnailUrl
						url
					}
				}
				... on RecordInterface {
					__typename
					id
				}
			}
		}
		slug
	}
}
